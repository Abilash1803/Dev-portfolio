  <rect x="20" y="168" width="174" height="172" rx="10" fill="#121424" stroke="#222642"/>
  <text x="32" y="190" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Deep Coding Focus</text>
  <text x="32" y="208" fill="#a78bfa" font-family="'Space Grotesk', sans-serif" font-size="11">Target: 4.5 hrs / day</text>
  <!-- Mini matrix dots -->
  <g fill="#8b5cf6">
    <rect x="32" y="222" width="16" height="16" rx="3"/>
    <rect x="52" y="222" width="16" height="16" rx="3"/>
    <rect x="72" y="222" width="16" height="16" rx="3"/>
    <rect x="92" y="222" width="16" height="16" rx="3"/>
    <rect x="112" y="222" width="16" height="16" rx="3"/>
    <rect x="132" y="222" width="16" height="16" rx="3"/>
    <rect x="152" y="222" width="16" height="16" rx="3"/>
