  <text x="32" y="260" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">98% Weekly Score</text>
  <rect x="32" y="278" width="150" height="8" rx="4" fill="#222642"/>
  <rect x="32" y="278" width="144" height="8" rx="4" fill="#8b5cf6"/>
  <text x="32" y="312" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Active Flow State</text>

  <!-- Habit 2: Fitness & Health -->
  <rect x="213" y="168" width="174" height="172" rx="10" fill="#121424" stroke="#222642"/>
  <text x="225" y="190" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Fitness &amp; Workout</text>
  <text x="225" y="208" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="11">Strength &amp; Calisthenics</text>
  <g fill="#0ea5e9">
