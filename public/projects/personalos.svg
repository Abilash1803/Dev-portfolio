<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#090a12"/>
  
  <!-- Browser Chrome Top Bar -->
  <rect width="600" height="42" fill="#111320"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="80" y="12" width="220" height="18" rx="9" fill="#1c2035"/>
  <text x="96" y="25" fill="#c084fc" font-family="'Space Grotesk', 'Poppins', sans-serif" font-size="11">personal-os.app // habit-matrix</text>
  
  <!-- PersonalOS Header Banner -->
  <rect x="20" y="58" width="560" height="96" rx="12" fill="url(#personal-grad)"/>
  <defs>
    <linearGradient id="personal-grad" x1="0" y1="0" x2="560" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c1d95"/>
      <stop offset="0.6" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
  </defs>

  <rect x="40" y="74" width="36" height="36" rx="8" fill="#8b5cf6"/>
  <!-- Target / Flame Icon -->
  <circle cx="58" cy="92" r="10" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <circle cx="58" cy="92" r="4" fill="#f59e0b"/>
  
  <text x="88" y="93" fill="#ffffff" font-family="'Syne', 'Poppins', sans-serif" font-weight="800" font-size="19">PERSONAL OS • HABIT TRACKER</text>
  <text x="88" y="114" fill="#ddd6fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Daily Life Operating System • Streak Mastery, Focus Analytics &amp; Micro-Routines</text>

  <!-- Streak Badge -->
