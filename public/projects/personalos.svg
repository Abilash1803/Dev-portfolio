    <rect x="245" y="222" width="16" height="16" rx="3"/>
    <rect x="265" y="222" width="16" height="16" rx="3"/>
    <rect x="285" y="222" width="16" height="16" rx="3"/>
    <rect x="305" y="222" width="16" height="16" rx="3"/>
    <rect x="325" y="222" width="16" height="16" rx="3" fill="#222642"/>
    <rect x="345" y="222" width="16" height="16" rx="3"/>
  </g>
  <text x="225" y="260" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">6 / 7 Days Done</text>
  <rect x="225" y="278" width="150" height="8" rx="4" fill="#222642"/>
  <rect x="225" y="278" width="128" height="8" rx="4" fill="#0ea5e9"/>
  <text x="225" y="312" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Strength Peak</text>

  <!-- Habit 3: Daily Reading & Research -->
  <rect x="406" y="168" width="174" height="172" rx="10" fill="#121424" stroke="#222642"/>
  <text x="418" y="190" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Books &amp; Tech Papers</text>
  <text x="418" y="208" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="11">30 Pages Every Evening</text>
  <g fill="#f59e0b">
    <rect x="418" y="222" width="16" height="16" rx="3"/>
    <rect x="438" y="222" width="16" height="16" rx="3"/>
    <rect x="458" y="222" width="16" height="16" rx="3"/>
    <rect x="478" y="222" width="16" height="16" rx="3"/>
    <rect x="498" y="222" width="16" height="16" rx="3"/>
    <rect x="518" y="222" width="16" height="16" rx="3"/>
    <rect x="538" y="222" width="16" height="16" rx="3"/>
  </g>
  <text x="418" y="260" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">100% Unbroken</text>
  <rect x="418" y="278" width="150" height="8" rx="4" fill="#222642"/>
  <rect x="418" y="278" width="150" height="8" rx="4" fill="#f59e0b"/>
  <text x="418" y="312" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">System Architecture</text>
