  <circle cx="444" cy="87" r="4" fill="#f59e0b"/>
  <text x="456" y="91" fill="#fde68a" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">🔥 42 Day Streak</text>

  <!-- Habit Tracker Matrix Cards -->
